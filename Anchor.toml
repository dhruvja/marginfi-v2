[programs.mainnet]
marginfi = "4sbjN16fgtnGMFaJ6s7aw9ha1uUQ9qLBv5gHSui2aNUU"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/marginfi", "programs/mocks", "programs/test_transfer_hook"]

[scripts]
test = "RUST_LOG= yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/*.spec.ts --exit --require tests/rootHooks.ts"

[test]
startup_wait = 60000
shutdown_wait = 2000
upgradeable = false

